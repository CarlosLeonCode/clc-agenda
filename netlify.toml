# Landing page (site/). The extension itself is not deployed anywhere.
[build]
  base = "site"
  # npm test builds the site first, so a failing check blocks the deploy
  command = "npm test"
  publish = "dist"
  # Skip deploys when nothing under site/ changed (e.g. extension-only commits)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "24"
  # Optional: NODE_AUTH_TOKEN (GitHub token with read:packages), set in Netlify's UI, never here.
  # With it npm installs @carlosleoncode/lead-capture and the new-version emails and the
  # privacy pages are on; without it npm skips that optional package and the site builds
  # without them. Production builds (CONTEXT=production) with leads on fail while
  # site/src/data/privacy.js still has TODO values.

[[headers]]
  for = "/*"
  [headers.values]
    # Everything is self-hosted: fonts, images and the GSAP bundle. The only outside
    # request is the optional "new version" email form (clc-leads on Supabase).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://xjftniraqohzpmxudqgx.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
